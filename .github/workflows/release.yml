name: Release

# Tag push (v*) builds every target, the .deb/.rpm packages and the Windows
# MSI, tests the packages in distro containers and the MSI on Windows,
# publishes a GitHub Release, updates the Homebrew formula
# (Formula/illumio-tui.rb) and the Scoop manifest (bucket/illumio-tui.json)
# on main, tests the winget manifests against the release MSI and submits
# them to winget-pkgs (Komac, when WINGET_TOKEN is set).
# workflow_dispatch is a dry run: same builds, archives, packages, package
# tests, winget manifest test and SHA256SUMS, uploaded as workflow
# artifacts; no release, no formula or manifest commit, no winget submission.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BIN: illumio-tui
  NFPM_VERSION: 2.47.0
  # sha256 of nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz from the nfpm release's checksums.txt.
  NFPM_SHA256: 0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783
  # WiX 5 is MS-RL; WiX 6 and later need the OSMF EULA accepted.
  WIX_VERSION: 5.0.2
  KOMAC_VERSION: 2.16.0
  # sha256 of komac-${KOMAC_VERSION}-x86_64-unknown-linux-gnu.tar.gz from the Komac release's SHA256SUMS.
  KOMAC_SHA256: 7d2707fa6210f2789a3702de49fbd150b736dbf426ee0b9bc8e098736f9fd82d
  WINGET_ID: AlexGoller.IllumioTUI

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, cross: false }
          # Fully static binary for old distros; cross ships a musl C toolchain for aws-lc-sys.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, cross: true }
          # Cross image provides the aarch64 gcc toolchain and an older glibc baseline.
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-latest, cross: true }
          - { target: aarch64-apple-darwin, os: macos-latest, cross: false }
          - { target: x86_64-apple-darwin, os: macos-latest, cross: false }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, cross: false }
    env:
      TARGET: ${{ matrix.target }}
      USE_CROSS: ${{ matrix.cross }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # The image is part of the key: objects built against one glibc must
      # never be reused on a runner with an older one (v0.1.0 hit this when
      # a ubuntu-latest cache was restored on ubuntu-22.04).
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.os }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Determine version
        id: version
        run: |
          cargo_version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "illumio-tui") | .version')
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "$tag_version" != "$cargo_version" ]]; then
              echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version"
              exit 1
            fi
          fi
          echo "version=$cargo_version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          if [[ "$USE_CROSS" == "true" ]]; then
            cross build --release --locked -p illumio-tui --target "$TARGET"
          else
            cargo build --release --locked -p illumio-tui --target "$TARGET"
          fi

      - name: Package
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          name="$BIN-$VERSION-$TARGET"
          exe="$BIN"
          [[ "$TARGET" == *windows* ]] && exe="$BIN.exe"
          bin_path="target/$TARGET/release/$exe"
          if [[ "$RUNNER_OS" != "Windows" ]]; then file "$bin_path"; fi
          mkdir -p "dist/$name"
          cp "$bin_path" README.md LICENSE "dist/$name/"
          cd dist
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            7z a "$name.zip" "$name" > /dev/null
            echo "archive=$name.zip" >> "$GITHUB_OUTPUT"
          else
            tar -czf "$name.tar.gz" "$name"
            echo "archive=$name.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Smoke test
        # Only where the host can execute the binary natively.
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-pc-windows-msvc'
        run: |
          exe="$BIN"
          [[ "$TARGET" == *windows* ]] && exe="$BIN.exe"
          "target/$TARGET/release/$exe" --version

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/${{ steps.package.outputs.archive }}
          if-no-files-found: error

  # .deb and .rpm from the already-built Linux binaries. x86_64 uses the
  # static musl build: the gnu build links against ubuntu-22.04's glibc 2.34+
  # and would not install-and-run on RHEL/Alma/Rocky 8 (2.28) or Debian 11
  # (2.31). aarch64 uses the gnu build (cross image, needs only glibc 2.18).
  packages:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "*-unknown-linux-*"
          merge-multiple: true

      - name: Install nfpm
        run: |
          tarball="nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/$tarball"
          echo "$NFPM_SHA256  $RUNNER_TEMP/$tarball" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" nfpm
          "$RUNNER_TEMP/nfpm" --version

      - name: Build packages
        run: |
          set -euo pipefail
          musl=$(ls dist/"$BIN"-*-x86_64-unknown-linux-musl.tar.gz)
          version=${musl#"dist/$BIN-"}
          version=${version%-x86_64-unknown-linux-musl.tar.gz}
          mkdir -p pkg unpack completions
          # Completion scripts from the x86_64 musl binary, which runs on this
          # runner; they are target-independent, so both arches ship them.
          tar -xzf "$musl" -C unpack
          host_bin="unpack/$BIN-$version-x86_64-unknown-linux-musl/$BIN"
          "$host_bin" completions bash > completions/illumio-tui.bash
          "$host_bin" completions zsh > completions/_illumio-tui
          "$host_bin" completions fish > completions/illumio-tui.fish
          bash -n completions/illumio-tui.bash
          for pair in amd64:x86_64-unknown-linux-musl arm64:aarch64-unknown-linux-gnu; do
            arch=${pair%%:*}
            target=${pair#*:}
            tar -xzf "dist/$BIN-$version-$target.tar.gz" -C unpack
            binary="unpack/$BIN-$version-$target/$BIN"
            file "$binary"
            for packager in deb rpm; do
              VERSION="$version" ARCH="$arch" BINARY="$binary" COMPLETIONS=completions \
                "$RUNNER_TEMP/nfpm" package -f packaging/nfpm.yaml -p "$packager" -t pkg/
            done
          done
          ls -l pkg

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            pkg/*.deb
            pkg/*.rpm
          if-no-files-found: error

  # Install each package in a stock distro container and run it. Plain
  # `docker run` rather than `container:` so the same steps work on the arm64
  # runner.
  package-test:
    name: package-test (${{ matrix.image }}, ${{ matrix.arch }})
    needs: packages
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "debian:12", kind: deb, arch: amd64, runner: ubuntu-latest }
          - { image: "ubuntu:22.04", kind: deb, arch: amd64, runner: ubuntu-latest }
          - { image: "rockylinux:9", kind: rpm, arch: x86_64, runner: ubuntu-latest }
          - { image: "almalinux:8", kind: rpm, arch: x86_64, runner: ubuntu-latest }
          - { image: "debian:12", kind: deb, arch: arm64, runner: ubuntu-24.04-arm }
          - { image: "almalinux:8", kind: rpm, arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: pkg

      - name: Install and run
        env:
          IMAGE: ${{ matrix.image }}
          KIND: ${{ matrix.kind }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          if [[ "$KIND" == deb ]]; then
            pkg=$(cd pkg && ls ./*_"$ARCH".deb)
            # Ubuntu's minimised images tell dpkg to skip /usr/share/doc; undo that.
            install="rm -f /etc/dpkg/dpkg.cfg.d/excludes; export DEBIAN_FRONTEND=noninteractive; apt-get update -qq && apt-get install -y /pkg/$pkg && dpkg -s $BIN && dpkg -L $BIN"
            remove="apt-get remove -y $BIN"
          else
            pkg=$(cd pkg && ls ./*."$ARCH".rpm)
            install="dnf install -y /pkg/$pkg && rpm -qi $BIN && rpm -ql $BIN"
            remove="dnf remove -y $BIN"
          fi
          docker run --rm -v "$PWD/pkg:/pkg:ro" "$IMAGE" bash -euxc "
            $install
            test \"\$(command -v $BIN)\" = /usr/bin/$BIN
            $BIN --version
            $BIN --help
            test -f /usr/share/doc/$BIN/LICENSE
            test -f /usr/share/doc/$BIN/README.md
            test -s /usr/share/bash-completion/completions/$BIN
            test -s /usr/share/zsh/site-functions/_$BIN
            test -s /usr/share/fish/vendor_completions.d/$BIN.fish
            bash -n /usr/share/bash-completion/completions/$BIN
            $remove
            test ! -e /usr/bin/$BIN
          "

  # Per-user MSI (packaging/windows/illumio-tui.wxs) from the windows zip's
  # binary. Before upload it is installed, upgraded in place by a second MSI
  # of the same binary with the patch version + 1 (test only, never
  # uploaded), and uninstalled (packaging/windows/test-msi.ps1).
  msi:
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      # The wix 5 tool targets net6.0; let it run on the runner's newer .NET.
      DOTNET_ROLL_FORWARD: Major
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: x86_64-pc-windows-msvc
          path: dist

      - name: Install WiX
        run: |
          dotnet tool install --global wix --version "$WIX_VERSION"
          wix --version

      - name: Build MSIs
        id: msi
        run: |
          set -euo pipefail
          zip=$(cd dist && ls "$BIN"-*-x86_64-pc-windows-msvc.zip)
          version=${zip#"$BIN-"}
          version=${version%-x86_64-pc-windows-msvc.zip}
          # MSI ProductVersion is numeric: 1.2.3-rc1 -> 1.2.3.
          msi_version=${version%%-*}
          if [[ ! "$msi_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::cannot make an MSI version from $version"
            exit 1
          fi
          IFS=. read -r major minor patch <<<"$msi_version"
          upgrade_version="$major.$minor.$((patch + 1))"
          7z x "dist/$zip" -ounpack > /dev/null
          bin_dir="unpack/$BIN-$version-x86_64-pc-windows-msvc"
          mkdir -p msi msi-test
          msi="msi/$BIN-$version-x86_64-pc-windows-msvc.msi"
          wix build packaging/windows/illumio-tui.wxs -arch x64 \
            -d Version="$msi_version" -d BinDir="$bin_dir" -o "$msi"
          wix build packaging/windows/illumio-tui.wxs -arch x64 \
            -d Version="$upgrade_version" -d BinDir="$bin_dir" -o msi-test/upgrade.msi
          ls -l msi msi-test
          {
            echo "msi=$msi"
            echo "msi_version=$msi_version"
            echo "upgrade_version=$upgrade_version"
          } >> "$GITHUB_OUTPUT"

      - name: Test install, upgrade, uninstall
        shell: pwsh
        env:
          MSI: ${{ steps.msi.outputs.msi }}
          MSI_VERSION: ${{ steps.msi.outputs.msi_version }}
          UPGRADE_VERSION: ${{ steps.msi.outputs.upgrade_version }}
        run: |
          ./packaging/windows/test-msi.ps1 -Msi $env:MSI -Version $env:MSI_VERSION `
            -UpgradeMsi msi-test/upgrade.msi -UpgradeVersion $env:UPGRADE_VERSION

      - name: Upload msiexec logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: msi-logs
          path: |
            msi/*.log
            msi-test/*.log

      - uses: actions/upload-artifact@v4
        with:
          name: msi
          path: ${{ steps.msi.outputs.msi }}
          if-no-files-found: error

  checksums:
    needs: [build, packages, msi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- *.tar.gz *.zip *.msi *.deb *.rpm > SHA256SUMS
          cat SHA256SUMS
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
          if-no-files-found: error

  release:
    needs: [checksums, package-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.msi
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS

  # winget manifests (packaging/winget/) for this build's MSI: render,
  # `winget validate`, then install, upgrade and uninstall from the local
  # manifests. Tag runs point the manifest at the published release asset
  # (so this runs after `release`); dry runs serve the dry-run MSI from a
  # local HTTP server. The upgrade target is the same binary in an MSI one
  # patch version up, always served locally; its manifest carries the
  # installed MSI's ProductCode so winget matches it to the installed
  # package, as the winget-pkgs source would. Dry runs also render and
  # validate the manifests for the latest published release, ready for a
  # manual winget-pkgs submission. The rendered manifests are uploaded.
  winget:
    needs: [msi, checksums, release]
    if: >-
      !cancelled() && needs.msi.result == 'success' && needs.checksums.result == 'success'
      && (needs.release.result == 'success'
          || (github.event_name == 'workflow_dispatch' && needs.release.result == 'skipped'))
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      DOTNET_ROLL_FORWARD: Major
      LOCAL_URL: http://127.0.0.1:8765
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: msi
          path: serve

      - uses: actions/download-artifact@v4
        with:
          name: SHA256SUMS
          path: sums

      - uses: actions/download-artifact@v4
        with:
          name: x86_64-pc-windows-msvc
          path: dist

      - name: Install WiX
        run: |
          dotnet tool install --global wix --version "$WIX_VERSION"
          wix --version

      - name: Render manifests
        id: render
        run: |
          set -euo pipefail
          msi=$(cd serve && ls "$BIN"-*-x86_64-pc-windows-msvc.msi)
          version=${msi#"$BIN-"}
          version=${version%-x86_64-pc-windows-msvc.msi}
          msi_version=${version%%-*}
          IFS=. read -r major minor patch <<<"$msi_version"
          upgrade_version="$major.$minor.$((patch + 1))"
          # The upgrade MSI: this build's binary, one patch version up.
          7z x "dist/$BIN-$version-x86_64-pc-windows-msvc.zip" -ounpack > /dev/null
          upgrade_msi="$BIN-$upgrade_version-x86_64-pc-windows-msvc.msi"
          wix build packaging/windows/illumio-tui.wxs -arch x64 \
            -d Version="$upgrade_version" -d BinDir="unpack/$BIN-$version-x86_64-pc-windows-msvc" \
            -o "serve/$upgrade_msi"
          (cd serve && sha256sum "$upgrade_msi") > upgrade-sums
          # The MSI the release publishes is this artifact, byte for byte.
          (cd serve && sha256sum --check --ignore-missing ../sums/SHA256SUMS)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            base_url=""
          else
            base_url="$LOCAL_URL"
          fi
          product_code=$(pwsh -NoProfile -File packaging/winget/product-code.ps1 "serve/$msi")
          upgrade_product_code=$(pwsh -NoProfile -File packaging/winget/product-code.ps1 "serve/$upgrade_msi")
          echo "ProductCode $msi: $product_code"
          BASE_URL="$base_url" PRODUCT_CODE="$product_code" \
            packaging/winget/render.sh "$version" sums/SHA256SUMS "manifests/$version"
          # The upgrade manifest names the installed MSI's ProductCode, the way
          # the winget-pkgs source maps an installed version to the package
          # (see packaging/winget/test-winget.ps1).
          echo "ProductCode $upgrade_msi: $upgrade_product_code"
          BASE_URL="$LOCAL_URL" PRODUCT_CODE="$product_code" \
            packaging/winget/render.sh "$upgrade_version" upgrade-sums "manifests-upgrade/$upgrade_version"
          head -n 100 manifests/"$version"/*.yaml
          grep -n 'InstallerUrl\|ProductCode' manifests-upgrade/"$upgrade_version"/*.installer.yaml
          {
            echo "version=$version"
            echo "msi_version=$msi_version"
            echo "upgrade_version=$upgrade_version"
          } >> "$GITHUB_OUTPUT"

      - name: Test validate, install, upgrade, uninstall
        shell: pwsh
        env:
          VERSION: ${{ steps.render.outputs.version }}
          MSI_VERSION: ${{ steps.render.outputs.msi_version }}
          UPGRADE_VERSION: ${{ steps.render.outputs.upgrade_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) { throw 'winget is not on this runner' }
          $server = Start-Process python -ArgumentList @('-m', 'http.server', '8765', '--bind', '127.0.0.1', '--directory', 'serve') -PassThru -NoNewWindow
          try {
            foreach ($i in 1..30) {
              try { Invoke-WebRequest "$env:LOCAL_URL/" -UseBasicParsing | Out-Null; break } catch { Start-Sleep -Seconds 1 }
            }
            ./packaging/winget/test-winget.ps1 -Manifest "manifests/$env:VERSION" -Version $env:VERSION `
              -MsiVersion $env:MSI_VERSION -UpgradeManifest "manifests-upgrade/$env:UPGRADE_VERSION" `
              -UpgradeVersion $env:UPGRADE_VERSION
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Render manifests for the latest release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          version=${tag#v}
          mkdir -p latest
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir latest \
            --pattern SHA256SUMS --pattern "$BIN-$version-x86_64-pc-windows-msvc.msi"
          (cd latest && sha256sum --check --ignore-missing SHA256SUMS)
          product_code=$(pwsh -NoProfile -File packaging/winget/product-code.ps1 "latest/$BIN-$version-x86_64-pc-windows-msvc.msi")
          echo "ProductCode $tag: $product_code"
          PRODUCT_CODE="$product_code" packaging/winget/render.sh "$version" latest/SHA256SUMS "manifests-latest/$version"
          winget validate --manifest "manifests-latest/$version"
          head -n 100 manifests-latest/"$version"/*.yaml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: winget-manifests
          path: |
            manifests
            manifests-upgrade
            manifests-latest
          if-no-files-found: ignore

  # Submit the release to microsoft/winget-pkgs with Komac: a PR from a fork
  # in the WINGET_TOKEN owner's account (classic PAT, public_repo scope).
  # Skipped with a notice when the secret is unset or the package is not in
  # winget-pkgs yet (the first submission is a manual PR). Pre-release tags
  # are skipped. Not a release gate. Dry runs only install Komac.
  winget-submit:
    needs: [release, winget]
    if: >-
      !cancelled() && needs.winget.result == 'success'
      && ((needs.release.result == 'success' && !contains(github.ref_name, '-'))
          || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Install Komac
        run: |
          tarball="komac-${KOMAC_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/russellbanks/Komac/releases/download/v${KOMAC_VERSION}/$tarball"
          echo "$KOMAC_SHA256  $RUNNER_TEMP/$tarball" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" komac
          "$RUNNER_TEMP/komac" --version

      - name: Submit to winget-pkgs
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -z "$WINGET_TOKEN" ]]; then
            echo "::notice::WINGET_TOKEN is not set; not submitting to winget-pkgs"
            exit 0
          fi
          status=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/a/AlexGoller/IllumioTUI")
          case "$status" in
            200) ;;
            404)
              echo "::notice::$WINGET_ID is not in microsoft/winget-pkgs yet; submit the first version manually"
              exit 0 ;;
            *)
              echo "::error::GitHub API returned $status looking up $WINGET_ID in microsoft/winget-pkgs"
              exit 1 ;;
          esac
          version="${GITHUB_REF_NAME#v}"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$BIN-$version-x86_64-pc-windows-msvc.msi"
          "$RUNNER_TEMP/komac" update "$WINGET_ID" --version "$version" --urls "$url" \
            --release-notes-url "https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" \
            --submit --token "$WINGET_TOKEN"

  # Render Formula/illumio-tui.rb and bucket/illumio-tui.json from their
  # templates with the release's sha256s and commit them to main, so
  # `brew tap alexgoller/illumio-tui https://github.com/alexgoller/illumio-tui`
  # and `scoop bucket add illumio-tui https://github.com/alexgoller/illumio-tui`
  # pick up the new version.
  # Pushes made with GITHUB_TOKEN start no workflows, and releases are
  # tag-driven anyway, so this commit cannot loop. Pre-release tags
  # (v1.2.3-rc1) are skipped.
  homebrew:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: homebrew-formula
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/download-artifact@v4
        with:
          name: SHA256SUMS
          path: sums

      - name: Render formula and Scoop manifest
        run: |
          version="${GITHUB_REF_NAME#v}"
          packaging/homebrew/render.sh "$version" sums/SHA256SUMS > Formula/illumio-tui.rb
          packaging/scoop/render.sh "$version" sums/SHA256SUMS > bucket/illumio-tui.json
          jq empty bucket/illumio-tui.json
          git diff --stat

      - name: Commit to main
        run: |
          version="${GITHUB_REF_NAME#v}"
          files=(Formula/illumio-tui.rb bucket/illumio-tui.json)
          if git diff --quiet -- "${files[@]}"; then
            echo "Formula and manifest already at $version"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          git commit -m "brew, scoop: illumio-tui $version"
          for _ in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          echo "::error::could not push the formula and manifest to main"
          exit 1

  # Dry runs only: add this checkout as a Scoop bucket, install the committed
  # manifest (the last release) from it, run it, and check that its autoupdate block, fed that same
  # version, finds the same hash in the release's SHA256SUMS. Not a release
  # gate: it depends on Scoop's installer and the published release.
  scoop-test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Scoop
        shell: pwsh
        run: |
          Invoke-Expression "& {$(Invoke-RestMethod https://get.scoop.sh)} -RunAsAdmin"
          "$env:USERPROFILE\scoop\shims" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install, run, autoupdate, uninstall
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content bucket/illumio-tui.json -Raw | ConvertFrom-Json
          $version = $manifest.version
          # As a user would, with this checkout standing in for the repository.
          scoop bucket add illumio-tui ('file:///' + ($env:GITHUB_WORKSPACE -replace '\\', '/'))
          if ($LASTEXITCODE -ne 0) { throw "scoop bucket add exited with $LASTEXITCODE" }
          scoop install illumio-tui/illumio-tui
          if ($LASTEXITCODE -ne 0) { throw "scoop install exited with $LASTEXITCODE" }
          $out = illumio-tui --version
          if ($LASTEXITCODE -ne 0 -or "$out" -notmatch [regex]::Escape($version)) { throw "illumio-tui --version: $out" }
          Write-Host "illumio-tui --version: $out"
          # Autoupdate on a copy with the hash blanked must restore it.
          $dir = Join-Path $env:RUNNER_TEMP 'bucket'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $copy = Get-Content bucket/illumio-tui.json -Raw | ConvertFrom-Json
          $copy.architecture.'64bit'.hash = '0' * 64
          $copy | ConvertTo-Json -Depth 10 | Set-Content (Join-Path $dir 'illumio-tui.json')
          $checkver = "$env:USERPROFILE\scoop\apps\scoop\current\bin\checkver.ps1"
          & $checkver -App illumio-tui -Dir $dir -Version $version -ForceUpdate -ThrowError
          $updated = Get-Content (Join-Path $dir 'illumio-tui.json') -Raw | ConvertFrom-Json
          $want = $manifest.architecture.'64bit'.hash
          $got = $updated.architecture.'64bit'.hash
          if ($got -ne $want) { throw "autoupdate hash $got, committed $want" }
          Write-Host "autoupdate hash matches: $got"
          # checkver against GitHub: the latest release, as Scoop sees it.
          & $checkver -App illumio-tui -Dir bucket -ThrowError
          scoop uninstall illumio-tui
          if ($LASTEXITCODE -ne 0) { throw "scoop uninstall exited with $LASTEXITCODE" }
