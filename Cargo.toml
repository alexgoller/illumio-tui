[workspace]
resolver = "3"
members = ["crates/pce", "crates/illumio-tui", "crates/xtask"]

[workspace.package]
version = "0.3.3"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
repository = "https://github.com/alexgoller/illumio-tui"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
tokio-util = "0.7"
reqwest = { version = "0.13", features = ["json", "query", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
jiff = { version = "0.2", features = ["serde"] }
humantime = "2"
secrecy = "0.10"
url = "2"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
toml = "1"
dirs = "7"
dotenvy = "0.15"
ratatui = "0.30"
wiremock = "0.6"
assert_cmd = "2"
predicates = "3"
tempfile = "3"
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
insta = "1"

[profile.release]
lto = "thin"
strip = true
