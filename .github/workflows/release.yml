name: Release

# Tag push (v*) builds every target, the .deb/.rpm packages and the Windows
# MSI, tests the packages in distro containers and the MSI on Windows,
# publishes a GitHub Release and updates the Homebrew formula
# (Formula/illumio-tui.rb) and the Scoop manifest (bucket/illumio-tui.json)
# on main.
# workflow_dispatch is a dry run: same builds, archives, packages, package
# tests and SHA256SUMS, uploaded as workflow artifacts; no release, no
# formula or manifest commit.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BIN: illumio-tui
  NFPM_VERSION: 2.47.0
  # sha256 of nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz from the nfpm release's checksums.txt.
  NFPM_SHA256: 0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783
  # WiX 5 is MS-RL; WiX 6 and later need the OSMF EULA accepted.
  WIX_VERSION: 5.0.2

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, cross: false }
          # Fully static binary for old distros; cross ships a musl C toolchain for aws-lc-sys.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, cross: true }
          # Cross image provides the aarch64 gcc toolchain and an older glibc baseline.
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-latest, cross: true }
          - { target: aarch64-apple-darwin, os: macos-latest, cross: false }
          - { target: x86_64-apple-darwin, os: macos-latest, cross: false }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, cross: false }
    env:
      TARGET: ${{ matrix.target }}
      USE_CROSS: ${{ matrix.cross }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # The image is part of the key: objects built against one glibc must
      # never be reused on a runner with an older one (v0.1.0 hit this when
      # a ubuntu-latest cache was restored on ubuntu-22.04).
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.os }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Determine version
        id: version
        run: |
          cargo_version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "illumio-tui") | .version')
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "$tag_version" != "$cargo_version" ]]; then
              echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version"
              exit 1
            fi
          fi
          echo "version=$cargo_version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          if [[ "$USE_CROSS" == "true" ]]; then
            cross build --release --locked -p illumio-tui --target "$TARGET"
          else
            cargo build --release --locked -p illumio-tui --target "$TARGET"
          fi

      - name: Package
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          name="$BIN-$VERSION-$TARGET"
          exe="$BIN"
          [[ "$TARGET" == *windows* ]] && exe="$BIN.exe"
          bin_path="target/$TARGET/release/$exe"
          if [[ "$RUNNER_OS" != "Windows" ]]; then file "$bin_path"; fi
          mkdir -p "dist/$name"
          cp "$bin_path" README.md LICENSE "dist/$name/"
          cd dist
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            7z a "$name.zip" "$name" > /dev/null
            echo "archive=$name.zip" >> "$GITHUB_OUTPUT"
          else
            tar -czf "$name.tar.gz" "$name"
            echo "archive=$name.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Smoke test
        # Only where the host can execute the binary natively.
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-pc-windows-msvc'
        run: |
          exe="$BIN"
          [[ "$TARGET" == *windows* ]] && exe="$BIN.exe"
          "target/$TARGET/release/$exe" --version

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/${{ steps.package.outputs.archive }}
          if-no-files-found: error

  # .deb and .rpm from the already-built Linux binaries. x86_64 uses the
  # static musl build: the gnu build links against ubuntu-22.04's glibc 2.34+
  # and would not install-and-run on RHEL/Alma/Rocky 8 (2.28) or Debian 11
  # (2.31). aarch64 uses the gnu build (cross image, needs only glibc 2.18).
  packages:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "*-unknown-linux-*"
          merge-multiple: true

      - name: Install nfpm
        run: |
          tarball="nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/$tarball"
          echo "$NFPM_SHA256  $RUNNER_TEMP/$tarball" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" nfpm
          "$RUNNER_TEMP/nfpm" --version

      - name: Build packages
        run: |
          set -euo pipefail
          musl=$(ls dist/"$BIN"-*-x86_64-unknown-linux-musl.tar.gz)
          version=${musl#"dist/$BIN-"}
          version=${version%-x86_64-unknown-linux-musl.tar.gz}
          mkdir -p pkg unpack completions
          # Completion scripts from the x86_64 musl binary, which runs on this
          # runner; they are target-independent, so both arches ship them.
          tar -xzf "$musl" -C unpack
          host_bin="unpack/$BIN-$version-x86_64-unknown-linux-musl/$BIN"
          "$host_bin" completions bash > completions/illumio-tui.bash
          "$host_bin" completions zsh > completions/_illumio-tui
          "$host_bin" completions fish > completions/illumio-tui.fish
          bash -n completions/illumio-tui.bash
          for pair in amd64:x86_64-unknown-linux-musl arm64:aarch64-unknown-linux-gnu; do
            arch=${pair%%:*}
            target=${pair#*:}
            tar -xzf "dist/$BIN-$version-$target.tar.gz" -C unpack
            binary="unpack/$BIN-$version-$target/$BIN"
            file "$binary"
            for packager in deb rpm; do
              VERSION="$version" ARCH="$arch" BINARY="$binary" COMPLETIONS=completions \
                "$RUNNER_TEMP/nfpm" package -f packaging/nfpm.yaml -p "$packager" -t pkg/
            done
          done
          ls -l pkg

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            pkg/*.deb
            pkg/*.rpm
          if-no-files-found: error

  # Install each package in a stock distro container and run it. Plain
  # `docker run` rather than `container:` so the same steps work on the arm64
  # runner.
  package-test:
    name: package-test (${{ matrix.image }}, ${{ matrix.arch }})
    needs: packages
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "debian:12", kind: deb, arch: amd64, runner: ubuntu-latest }
          - { image: "ubuntu:22.04", kind: deb, arch: amd64, runner: ubuntu-latest }
          - { image: "rockylinux:9", kind: rpm, arch: x86_64, runner: ubuntu-latest }
          - { image: "almalinux:8", kind: rpm, arch: x86_64, runner: ubuntu-latest }
          - { image: "debian:12", kind: deb, arch: arm64, runner: ubuntu-24.04-arm }
          - { image: "almalinux:8", kind: rpm, arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: pkg

      - name: Install and run
        env:
          IMAGE: ${{ matrix.image }}
          KIND: ${{ matrix.kind }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          if [[ "$KIND" == deb ]]; then
            pkg=$(cd pkg && ls ./*_"$ARCH".deb)
            # Ubuntu's minimised images tell dpkg to skip /usr/share/doc; undo that.
            install="rm -f /etc/dpkg/dpkg.cfg.d/excludes; export DEBIAN_FRONTEND=noninteractive; apt-get update -qq && apt-get install -y /pkg/$pkg && dpkg -s $BIN && dpkg -L $BIN"
            remove="apt-get remove -y $BIN"
          else
            pkg=$(cd pkg && ls ./*."$ARCH".rpm)
            install="dnf install -y /pkg/$pkg && rpm -qi $BIN && rpm -ql $BIN"
            remove="dnf remove -y $BIN"
          fi
          docker run --rm -v "$PWD/pkg:/pkg:ro" "$IMAGE" bash -euxc "
            $install
            test \"\$(command -v $BIN)\" = /usr/bin/$BIN
            $BIN --version
            $BIN --help
            test -f /usr/share/doc/$BIN/LICENSE
            test -f /usr/share/doc/$BIN/README.md
            test -s /usr/share/bash-completion/completions/$BIN
            test -s /usr/share/zsh/site-functions/_$BIN
            test -s /usr/share/fish/vendor_completions.d/$BIN.fish
            bash -n /usr/share/bash-completion/completions/$BIN
            $remove
            test ! -e /usr/bin/$BIN
          "

  # Per-user MSI (packaging/windows/illumio-tui.wxs) from the windows zip's
  # binary. Before upload it is installed, upgraded in place by a second MSI
  # of the same binary with the patch version + 1 (test only, never
  # uploaded), and uninstalled (packaging/windows/test-msi.ps1).
  msi:
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      # The wix 5 tool targets net6.0; let it run on the runner's newer .NET.
      DOTNET_ROLL_FORWARD: Major
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: x86_64-pc-windows-msvc
          path: dist

      - name: Install WiX
        run: |
          dotnet tool install --global wix --version "$WIX_VERSION"
          wix --version

      - name: Build MSIs
        id: msi
        run: |
          set -euo pipefail
          zip=$(cd dist && ls "$BIN"-*-x86_64-pc-windows-msvc.zip)
          version=${zip#"$BIN-"}
          version=${version%-x86_64-pc-windows-msvc.zip}
          # MSI ProductVersion is numeric: 1.2.3-rc1 -> 1.2.3.
          msi_version=${version%%-*}
          if [[ ! "$msi_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::cannot make an MSI version from $version"
            exit 1
          fi
          IFS=. read -r major minor patch <<<"$msi_version"
          upgrade_version="$major.$minor.$((patch + 1))"
          7z x "dist/$zip" -ounpack > /dev/null
          bin_dir="unpack/$BIN-$version-x86_64-pc-windows-msvc"
          mkdir -p msi msi-test
          msi="msi/$BIN-$version-x86_64-pc-windows-msvc.msi"
          wix build packaging/windows/illumio-tui.wxs -arch x64 \
            -d Version="$msi_version" -d BinDir="$bin_dir" -o "$msi"
          wix build packaging/windows/illumio-tui.wxs -arch x64 \
            -d Version="$upgrade_version" -d BinDir="$bin_dir" -o msi-test/upgrade.msi
          ls -l msi msi-test
          {
            echo "msi=$msi"
            echo "msi_version=$msi_version"
            echo "upgrade_version=$upgrade_version"
          } >> "$GITHUB_OUTPUT"

      - name: Test install, upgrade, uninstall
        shell: pwsh
        env:
          MSI: ${{ steps.msi.outputs.msi }}
          MSI_VERSION: ${{ steps.msi.outputs.msi_version }}
          UPGRADE_VERSION: ${{ steps.msi.outputs.upgrade_version }}
        run: |
          ./packaging/windows/test-msi.ps1 -Msi $env:MSI -Version $env:MSI_VERSION `
            -UpgradeMsi msi-test/upgrade.msi -UpgradeVersion $env:UPGRADE_VERSION

      - name: Upload msiexec logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: msi-logs
          path: |
            msi/*.log
            msi-test/*.log

      - uses: actions/upload-artifact@v4
        with:
          name: msi
          path: ${{ steps.msi.outputs.msi }}
          if-no-files-found: error

  checksums:
    needs: [build, packages, msi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- *.tar.gz *.zip *.msi *.deb *.rpm > SHA256SUMS
          cat SHA256SUMS
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
          if-no-files-found: error

  release:
    needs: [checksums, package-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.msi
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS

  # Render Formula/illumio-tui.rb and bucket/illumio-tui.json from their
  # templates with the release's sha256s and commit them to main, so
  # `brew tap alexgoller/illumio-tui https://github.com/alexgoller/illumio-tui`
  # and `scoop bucket add illumio-tui https://github.com/alexgoller/illumio-tui`
  # pick up the new version.
  # Pushes made with GITHUB_TOKEN start no workflows, and releases are
  # tag-driven anyway, so this commit cannot loop. Pre-release tags
  # (v1.2.3-rc1) are skipped.
  homebrew:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: homebrew-formula
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/download-artifact@v4
        with:
          name: SHA256SUMS
          path: sums

      - name: Render formula and Scoop manifest
        run: |
          version="${GITHUB_REF_NAME#v}"
          packaging/homebrew/render.sh "$version" sums/SHA256SUMS > Formula/illumio-tui.rb
          packaging/scoop/render.sh "$version" sums/SHA256SUMS > bucket/illumio-tui.json
          jq empty bucket/illumio-tui.json
          git diff --stat

      - name: Commit to main
        run: |
          version="${GITHUB_REF_NAME#v}"
          files=(Formula/illumio-tui.rb bucket/illumio-tui.json)
          if git diff --quiet -- "${files[@]}"; then
            echo "Formula and manifest already at $version"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          git commit -m "brew, scoop: illumio-tui $version"
          for _ in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          echo "::error::could not push the formula and manifest to main"
          exit 1

  # Dry runs only: add this checkout as a Scoop bucket, install the committed
  # manifest (the last release) from it, run it, and check that its autoupdate block, fed that same
  # version, finds the same hash in the release's SHA256SUMS. Not a release
  # gate: it depends on Scoop's installer and the published release.
  scoop-test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Scoop
        shell: pwsh
        run: |
          Invoke-Expression "& {$(Invoke-RestMethod https://get.scoop.sh)} -RunAsAdmin"
          "$env:USERPROFILE\scoop\shims" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install, run, autoupdate, uninstall
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content bucket/illumio-tui.json -Raw | ConvertFrom-Json
          $version = $manifest.version
          # As a user would, with this checkout standing in for the repository.
          scoop bucket add illumio-tui $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { throw "scoop bucket add exited with $LASTEXITCODE" }
          scoop install illumio-tui/illumio-tui
          if ($LASTEXITCODE -ne 0) { throw "scoop install exited with $LASTEXITCODE" }
          $out = illumio-tui --version
          if ($LASTEXITCODE -ne 0 -or "$out" -notmatch [regex]::Escape($version)) { throw "illumio-tui --version: $out" }
          Write-Host "illumio-tui --version: $out"
          # Autoupdate on a copy with the hash blanked must restore it.
          $dir = Join-Path $env:RUNNER_TEMP 'bucket'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $copy = Get-Content bucket/illumio-tui.json -Raw | ConvertFrom-Json
          $copy.architecture.'64bit'.hash = '0' * 64
          $copy | ConvertTo-Json -Depth 10 | Set-Content (Join-Path $dir 'illumio-tui.json')
          $checkver = "$env:USERPROFILE\scoop\apps\scoop\current\bin\checkver.ps1"
          & $checkver -App illumio-tui -Dir $dir -Version $version -ForceUpdate -ThrowError
          $updated = Get-Content (Join-Path $dir 'illumio-tui.json') -Raw | ConvertFrom-Json
          $want = $manifest.architecture.'64bit'.hash
          $got = $updated.architecture.'64bit'.hash
          if ($got -ne $want) { throw "autoupdate hash $got, committed $want" }
          Write-Host "autoupdate hash matches: $got"
          # checkver against GitHub: the latest release, as Scoop sees it.
          & $checkver -App illumio-tui -Dir bucket -ThrowError
          scoop uninstall illumio-tui
          if ($LASTEXITCODE -ne 0) { throw "scoop uninstall exited with $LASTEXITCODE" }
