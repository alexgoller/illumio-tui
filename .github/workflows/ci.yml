name: CI
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The marks speed check (200k flows x 200 marks; 300 ms locally),
      # release only, on one runner. Shared runners are about 2x slower and
      # noisy, so CI guards only against gross regressions.
      - if: matrix.os == 'ubuntu-latest'
        env:
          MARKS_PERF_BUDGET_MS: "1000"
        run: cargo test --release -p pce --test marks_perf -- --ignored --nocapture
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
