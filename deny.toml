[graph]
all-features = true

[advisories]
ignore = []

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Unlicense", "Zlib", "MPL-2.0", "CDLA-Permissive-2.0", "OpenSSL"]
# The three workspace crates are GPL-3.0-only by the project's own choice
# (see [workspace.package] in Cargo.toml); this is not a third-party
# dependency licence, so it is allowed only for these crates by name,
# not added to the allow list above (which stays permissive-only for the
# dependency graph).
exceptions = [
    { allow = ["GPL-3.0-only"], crate = "illumio-tui" },
    { allow = ["GPL-3.0-only"], crate = "pce" },
    { allow = ["GPL-3.0-only"], crate = "xtask" },
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
